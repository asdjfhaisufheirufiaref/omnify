[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnify"
version = "0.1.0"
description = "All-in-one desktop toolbox: calculator, calendar, timer, stopwatch, task manager and more"
readme = "README.md"
requires-python = ">=3.10"
# Runtime needs PyGObject + GTK 4 (system packages on most distros,
# e.g. `python-gobject` + `gtk4` on Arch/CachyOS); they are not pulled
# from PyPI on purpose.
dependencies = []

[project.scripts]
omnify = "omnify.main:main"
omnify-browser = "omnify.browser_launcher:main"

[tool.setuptools]
packages = [
    "omnify",
    "omnify.core",
    "omnify.app",
    "omnify.modules",
    "omnify.locales",
]
