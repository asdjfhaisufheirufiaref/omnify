<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Omnify Notes wireframe</title>
  <desc id="desc">Low-fidelity wireframe of Omnify Notes: app sidebar, searchable note list, Markdown editor, toolbar, tags, metadata and rendered preview.</desc>
  <defs>
    <style>
      .bg { fill: #15161b; }
      .sidebar { fill: #1d1e25; }
      .panel { fill: #1b1d23; }
      .card { fill: #24262e; stroke: #343741; stroke-width: 1; }
      .accent { fill: #8d7cf6; }
      .text { fill: #f0f1f7; font-family: Inter, DejaVu Sans, sans-serif; }
      .muted { fill: #989baa; font-family: Inter, DejaVu Sans, sans-serif; }
      .small { fill: #b8bbc8; font-family: Inter, DejaVu Sans, sans-serif; }
      .dim { fill: #737786; font-family: Inter, DejaVu Sans, sans-serif; }
      .nav { fill: #c0c2ce; font-family: Inter, DejaVu Sans, sans-serif; font-size: 15px; }
      .button { fill: #2d2f39; stroke: #444754; stroke-width: 1; }
      .pill { fill: #322d52; stroke: #675aae; stroke-width: 1; }
      .row { fill: #20222a; }
      .selected { fill: #2b2d3a; stroke: #5f55a5; stroke-width: 1; }
      .tag { fill: #2a2c36; stroke: #414451; stroke-width: 1; }
      .code { fill: #191b21; stroke: #30333d; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="sidebar" width="220" height="900"/>

  <!-- App sidebar -->
  <circle class="accent" cx="38" cy="42" r="14"/>
  <text class="text" x="62" y="49" font-size="20" font-weight="700">Omnify</text>
  <text class="dim" x="20" y="94" font-size="10" letter-spacing="1.4">WORKSPACE</text>
  <text class="nav" x="30" y="132">Dashboard</text>
  <rect class="pill" x="12" y="150" width="194" height="38" rx="9"/>
  <text class="text" x="30" y="175" font-size="15" font-weight="600">Notes</text>
  <text class="nav" x="30" y="221">Calendar</text>
  <text class="nav" x="30" y="259">Timer</text>
  <text class="nav" x="30" y="297">Stopwatch</text>
  <text class="nav" x="30" y="335">Alarm</text>
  <text class="nav" x="30" y="373">Calculator</text>
  <text class="nav" x="30" y="411">Task Manager</text>
  <text class="nav" x="30" y="449">Browser</text>
  <line x1="16" y1="486" x2="204" y2="486" stroke="#353741"/>
  <text class="nav" x="30" y="522">Settings</text>
  <text class="nav" x="30" y="560">About</text>
  <rect class="card" x="14" y="806" width="192" height="64" rx="10"/>
  <circle cx="31" cy="838" r="5" fill="#79d7a5"/>
  <text class="small" x="44" y="834" font-size="11">Autosave on</text>
  <text class="dim" x="44" y="852" font-size="10">Markdown · local-first</text>

  <!-- Notes list panel -->
  <rect class="panel" x="220" y="0" width="320" height="900"/>
  <line x1="540" y1="0" x2="540" y2="900" stroke="#30323b"/>
  <text class="text" x="242" y="48" font-size="22" font-weight="700">Notes</text>
  <text class="muted" x="242" y="69" font-size="11">24 notes · local</text>
  <rect class="button" x="438" y="28" width="36" height="32" rx="8"/>
  <text class="small" x="451" y="49" font-size="16">+</text>
  <rect class="button" x="482" y="28" width="36" height="32" rx="8"/>
  <text class="small" x="493" y="49" font-size="14">◷</text>

  <rect x="240" y="94" width="280" height="36" rx="8" fill="#20222a" stroke="#353844"/>
  <text class="dim" x="256" y="117" font-size="12">Search notes or #tag</text>
  <text class="dim" x="494" y="117" font-size="14">⌕</text>

  <rect class="button" x="240" y="144" width="134" height="30" rx="7"/>
  <text class="small" x="256" y="164" font-size="11">All notes</text>
  <rect x="382" y="144" width="92" height="30" rx="7" fill="#20222a" stroke="#353844"/>
  <text class="muted" x="397" y="164" font-size="11">Unfiled</text>
  <rect x="482" y="144" width="38" height="30" rx="7" fill="#20222a" stroke="#353844"/>
  <text class="muted" x="495" y="164" font-size="12">▾</text>
  <text class="dim" x="240" y="196" font-size="10" letter-spacing="1.2">JOURNAL</text>
  <text class="small" x="240" y="218" font-size="12">📖  Today's journal</text>
  <text class="dim" x="240" y="242" font-size="10" letter-spacing="1.2">FOLDERS</text>
  <text class="small" x="240" y="264" font-size="12">📁  Journal</text>
  <text class="small" x="240" y="288" font-size="12">📁  Work</text>
  <text class="small" x="240" y="312" font-size="12">📁  Study</text>

  <line x1="240" y1="334" x2="520" y2="334" stroke="#30333d"/>
  <text class="dim" x="240" y="358" font-size="10" letter-spacing="1.2">PINNED</text>

  <rect class="selected" x="232" y="370" width="296" height="76" rx="9"/>
  <text class="text" x="246" y="395" font-size="13" font-weight="600">Weekly review</text>
  <text class="dim" x="246" y="414" font-size="10">Journal · pinned · just now</text>
  <text class="dim" x="246" y="432" font-size="10">#review  #planning</text>

  <rect class="row" x="232" y="454" width="296" height="72" rx="9"/>
  <text class="text" x="246" y="479" font-size="13" font-weight="600">Project ideas</text>
  <text class="dim" x="246" y="498" font-size="10">Work · yesterday</text>
  <text class="dim" x="246" y="516" font-size="10">#work  #ideas</text>

  <rect class="row" x="232" y="534" width="296" height="72" rx="9"/>
  <text class="text" x="246" y="559" font-size="13" font-weight="600">Study plan</text>
  <text class="dim" x="246" y="578" font-size="10">Study · Monday</text>
  <text class="dim" x="246" y="596" font-size="10">#study  #exams</text>

  <text class="dim" x="240" y="638" font-size="10" letter-spacing="1.2">ALL NOTES</text>
  <rect class="row" x="232" y="650" width="296" height="58" rx="9"/>
  <text class="text" x="246" y="674" font-size="12">Shopping list</text>
  <text class="dim" x="246" y="692" font-size="10">Personal · 2 days ago</text>
  <rect class="row" x="232" y="716" width="296" height="58" rx="9"/>
  <text class="text" x="246" y="740" font-size="12">Reading list</text>
  <text class="dim" x="246" y="758" font-size="10">Personal · 3 days ago</text>

  <text class="dim" x="240" y="870" font-size="10">24 notes · 6 tags · 3 folders</text>

  <!-- Editor -->
  <text class="dim" x="568" y="44" font-size="10" letter-spacing="1.2">NOTES / JOURNAL</text>
  <text class="text" x="568" y="78" font-size="28" font-weight="700">Weekly review</text>
  <text class="small" x="568" y="102" font-size="12">Journal · 11 Nov 2026 · saved</text>

  <rect class="button" x="1000" y="48" width="58" height="30" rx="7"/>
  <text class="small" x="1014" y="68" font-size="11">📌 Pin</text>
  <rect class="button" x="1068" y="48" width="78" height="30" rx="7"/>
  <text class="small" x="1080" y="68" font-size="11">History</text>
  <rect class="button" x="1156" y="48" width="44" height="30" rx="7"/>
  <text class="small" x="1172" y="68" font-size="14">⋯</text>

  <text class="muted" x="568" y="132" font-size="11">Tags</text>
  <rect class="tag" x="612" y="114" width="68" height="26" rx="13"/>
  <text class="small" x="626" y="132" font-size="11">#review</text>
  <rect class="tag" x="688" y="114" width="82" height="26" rx="13"/>
  <text class="small" x="702" y="132" font-size="11">#planning</text>
  <rect class="tag" x="778" y="114" width="26" height="26" rx="13"/>
  <text class="small" x="787" y="132" font-size="13">+</text>

  <line x1="568" y1="154" x2="1416" y2="154" stroke="#30333d"/>

  <!-- Toolbar -->
  <rect class="button" x="568" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="579" y="188" font-size="13" font-weight="700">B</text>
  <rect class="button" x="610" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="621" y="188" font-size="13" font-style="italic">I</text>
  <rect class="button" x="652" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="661" y="188" font-size="13" text-decoration="line-through">S</text>
  <rect class="button" x="694" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="705" y="188" font-size="13" font-weight="700">H</text>
  <rect class="button" x="736" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="746" y="188" font-size="13">•</text>
  <rect class="button" x="778" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="787" y="188" font-size="13">☑</text>
  <rect class="button" x="820" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="830" y="188" font-size="13">▦</text>
  <rect class="button" x="862" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="872" y="188" font-size="13">🖼</text>
  <rect class="button" x="904" y="168" width="34" height="30" rx="6"/>
  <text class="text" x="914" y="188" font-size="13">🔗</text>
  <rect class="button" x="958" y="168" width="70" height="30" rx="6"/>
  <text class="small" x="974" y="188" font-size="11">Preview</text>
  <rect class="button" x="1038" y="168" width="62" height="30" rx="6"/>
  <text class="small" x="1051" y="188" font-size="11">Find</text>
  <rect class="button" x="1110" y="168" width="82" height="30" rx="6"/>
  <text class="small" x="1125" y="188" font-size="11">Export</text>

  <!-- Markdown editor -->
  <rect x="568" y="216" width="488" height="596" rx="10" fill="#1d1f26" stroke="#30333d"/>
  <text class="text" x="590" y="250" font-size="20" font-weight="700"># Weekly review</text>
  <text class="muted" x="590" y="282" font-size="13">## Priorities</text>
  <text class="small" x="590" y="310" font-size="13">- [x] Finish the practical report</text>
  <text class="small" x="590" y="332" font-size="13">- [ ] Run the full test suite</text>
  <text class="small" x="590" y="354" font-size="13">- [ ] Prepare the demo</text>
  <text class="muted" x="590" y="390" font-size="13">## Notes</text>
  <text class="small" x="590" y="418" font-size="13">The local-first workflow is working well.</text>
  <text class="small" x="590" y="440" font-size="13">Next: check the **export** and _preview_.</text>
  <text class="muted" x="590" y="476" font-size="13">## Schedule</text>
  <text class="small" x="590" y="504" font-size="13">| Time  | Task          |</text>
  <text class="small" x="590" y="526" font-size="13">| 14:00 | Study block   |</text>
  <text class="small" x="590" y="548" font-size="13">| 20:00 | Weekly review |</text>
  <rect class="code" x="590" y="576" width="440" height="54" rx="6"/>
  <text class="dim" x="604" y="598" font-size="11">nerdctl run --rm -it python:3.12</text>
  <text class="dim" x="604" y="616" font-size="11">python -m unittest discover -s tests</text>
  <rect x="590" y="654" width="2" height="18" fill="#a99cff"/>
  <text class="dim" x="590" y="760" font-size="10">Markdown source · autosaved 2 seconds ago</text>

  <!-- Preview panel -->
  <rect class="card" x="1072" y="216" width="344" height="596" rx="10"/>
  <text class="text" x="1094" y="250" font-size="18" font-weight="700">Weekly review</text>
  <text class="dim" x="1094" y="270" font-size="10">PREVIEW · TOGGLE</text>
  <line x1="1094" y1="284" x2="1394" y2="284" stroke="#353741"/>
  <text class="text" x="1094" y="316" font-size="16" font-weight="700">Priorities</text>
  <text class="small" x="1094" y="342" font-size="12">☑ Finish the practical report</text>
  <text class="small" x="1094" y="364" font-size="12">☐ Run the full test suite</text>
  <text class="small" x="1094" y="386" font-size="12">☐ Prepare the demo</text>
  <text class="text" x="1094" y="424" font-size="16" font-weight="700">Notes</text>
  <text class="small" x="1094" y="450" font-size="12">The local-first workflow is working well.</text>
  <text class="small" x="1094" y="472" font-size="12">Next: check the export and
    <tspan font-weight="700">preview</tspan>.
  </text>
  <text class="text" x="1094" y="510" font-size="16" font-weight="700">Schedule</text>
  <rect x="1094" y="528" width="300" height="28" rx="4" fill="#20242a" stroke="#343844"/>
  <text class="small" x="1106" y="547" font-size="11" font-weight="600">Time</text>
  <text class="small" x="1190" y="547" font-size="11" font-weight="600">Task</text>
  <text class="small" x="1106" y="575" font-size="11">14:00</text>
  <text class="small" x="1190" y="575" font-size="11">Study block</text>
  <text class="small" x="1106" y="597" font-size="11">20:00</text>
  <text class="small" x="1190" y="597" font-size="11">Weekly review</text>
  <rect class="code" x="1094" y="626" width="300" height="70" rx="6"/>
  <text class="dim" x="1108" y="650" font-size="10">nerdctl run --rm -it python:3.12</text>
  <text class="dim" x="1108" y="668" font-size="10">python -m unittest discover -s tests</text>
  <text class="dim" x="1094" y="760" font-size="10">Rendered without WebKit · images inline</text>

  <!-- Status -->
  <line x1="540" y1="842" x2="1416" y2="842" stroke="#30333d"/>
  <text class="dim" x="568" y="868" font-size="11">12 words · Saved</text>
  <text class="dim" x="1180" y="868" font-size="11">Ctrl+H find · Ctrl+S save · Ctrl+B bold</text>
</svg>
